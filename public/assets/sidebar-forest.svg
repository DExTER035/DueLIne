<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132B25" stop-opacity="0" />
      <stop offset="30%" stop-color="#142F29" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E211C" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="mist1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34594E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#132B25" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mist2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A887A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#132B25" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="320" height="200" fill="url(#bgGrad)" />

