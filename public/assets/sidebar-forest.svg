    <polygon points="35,128 30,152 40,152" />
    <polygon points="50,132 45,154 55,154" />
    <polygon points="65,124 59,155 71,155" />
    <polygon points="80,130 75,155 85,155" />
    <polygon points="98,122 92,152 104,152" />
    <polygon points="115,126 110,155 120,155" />
    <polygon points="135,120 128,155 142,155" />
    <polygon points="152,125 147,155 157,155" />
    <polygon points="170,118 163,155 177,155" />
    <polygon points="188,124 182,154 194,154" />
    <polygon points="205,120 199,152 211,152" />
    <polygon points="225,125 219,155 231,155" />
    <polygon points="242,119 236,155 248,155" />
    <polygon points="260,126 255,155 265,155" />
    <polygon points="280,122 274,155 286,155" />
