<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
    <radialGradient id="sunSky" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E9E2C6" />
      <stop offset="50%" stop-color="#A5BAA0" />
      <stop offset="100%" stop-color="#557564" />
    </radialGradient>
  </defs>

  <g clip-path="url(#circleClip)">
    <rect width="100" height="100" fill="url(#sunSky)" />

    <!-- Mountain ridges -->
    <path d="M-10,65 Q25,45 50,55 T110,48 L110,100 L-10,100 Z" fill="#3D5A4C" opacity="0.7" />
    <path d="M-10,72 Q35,60 65,68 T110,62 L110,100 L-10,100 Z" fill="#243F33" opacity="0.9" />

    <!-- Pine trees in foreground -->
    <g fill="#12241C">
      <polygon points="15,62 10,80 20,80" />
      <polygon points="25,58 19,82 31,82" />
      <polygon points="38,64 33,85 43,85" />
      <polygon points="50,56 43,85 57,85" />
      <polygon points="63,60 57,85 69,85" />
      <polygon points="76,55 69,85 83,85" />
      <polygon points="88,62 82,85 94,85" />
    </g>

    <!-- Warm sun glow -->
    <circle cx="50" cy="38" r="14" fill="#FFF8DE" opacity="0.6" filter="blur(2px)" />
  </g>
</svg>

